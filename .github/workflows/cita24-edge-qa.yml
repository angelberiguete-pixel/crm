name: Cita-24 Edge verification

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/cita24-*/**"
      - "supabase/migrations/*cita24*"
      - "tests/cita24-*"
      - ".github/workflows/cita24-edge-qa.yml"
  workflow_dispatch:

jobs:
  edge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check patient portal intake function
        run: deno check supabase/functions/cita24-public-request/index.ts
      - name: Check supervised OpenAI reception function
        run: deno check supabase/functions/cita24-reception-draft/index.ts
      - name: Check guarded YCloud reminder dispatcher
        run: deno check supabase/functions/cita24-reminder-dispatch/index.ts
      - name: Validate public portal, privacy and opt-in contracts
        run: node --test tests/cita24-portal-ai-whatsapp-contract.test.mjs
