name: CRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Tenant context regression tests
        run: node --experimental-strip-types --test tests/tenant-context.test.mjs
      - name: Automation execution regression tests
        run: node --experimental-strip-types --test tests/automation-worker.test.mjs
      - name: CRM frontend secrets, tenant isolation and webhook safety regressions
        run: node --experimental-strip-types --test tests/crm-frontend-guards.test.mjs tests/automation-webhook-validation.test.mjs
      - name: Security source and integration credential regressions
        run: node --test tests/security/security-source-regressions.test.mjs
      - name: Automation worker typecheck
        run: npx tsc --noEmit --target ES2022 --module preserve --moduleResolution bundler --skipLibCheck supabase/functions/automation-engine/worker.ts
      - name: Branding and tenant portal regression tests
        run: node --experimental-strip-types --test tests/official-brand-and-portals.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium
      - name: Official logo browser rendering and loading test
        run: node tests/look-brand-browser.test.mjs
      - name: Tenant switching browser regression tests
        run: npm run test:browser:tenant
      - name: Password recovery browser regression tests
        run: node tests/auth-browser.test.mjs
      - name: Owner initial password browser regression tests
        run: node tests/owner-first-access-browser.test.mjs
      - name: Owner bootstrap live endpoint denial test
        run: node tests/owner-first-access-edge-live.test.mjs
      - name: Super Admin mobile browser regression tests
        run: node tests/platform-admin-browser.test.mjs
      - name: Private tenant files browser regression tests
        run: node tests/tenant-files-browser.test.mjs
      - name: Spanish team conversations and assignment browser tests
        run: node tests/omnichannel-assignment-browser.test.mjs
      - name: Company channel authorization browser regression tests
        run: node tests/company-channel-onboarding-browser.test.mjs
