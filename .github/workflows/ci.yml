name: CRM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Tenant context regression tests
        run: node --experimental-strip-types --test tests/tenant-context.test.mjs
      - name: Automation execution regression tests
        run: node --experimental-strip-types --test tests/automation-worker.test.mjs
      - name: CRM frontend secrets, tenant isolation and webhook safety regressions
        run: node --experimental-strip-types --test tests/crm-frontend-guards.test.mjs tests/automation-webhook-validation.test.mjs
      - name: Atomic CRM contact vCard export regression tests
        run: node --experimental-strip-types --test tests/contact-vcard.test.mjs
      - name: Meta Business Suite callback verification and event contract tests
        run: node --experimental-strip-types --test tests/meta-webhook.test.mjs
      - name: WhatsApp Cloud API test-send policy and tenant ownership tests
        run: node --experimental-strip-types --test tests/whatsapp-test-send.test.mjs
      - name: Digital staff validated role, human-review and provider budget tests
        run: node --experimental-strip-types --test tests/digital-employees.test.mjs tests/digital-employee-trials-reviews.test.mjs tests/ai-employee-provider.test.mjs
      - name: Verified WhatsApp inbound routing, HMAC and tenant isolation contracts
        run: node --experimental-strip-types --test tests/meta-whatsapp-inbound.test.mjs
      - name: Look Digital Staff commercial demo, sales logging and onboarding safety contracts
        run: node --experimental-strip-types --test tests/digital-staff-commercial-readiness.test.mjs
      - name: CRM per-tenant integrations, safe backend health and no-secret contracts
        run: node --experimental-strip-types --test tests/crm-integration-center.test.mjs
      - name: Automation worker typecheck
        run: npx tsc --noEmit --target ES2022 --module preserve --moduleResolution bundler --skipLibCheck supabase/functions/automation-engine/worker.ts
      - name: Branding and tenant portal regression tests
        run: node --experimental-strip-types --test tests/official-brand-and-portals.test.mjs
      - name: Family Power unified tenant and approved brand variants
        run: node --experimental-strip-types --test tests/family-power-unified-tenant.test.mjs
      - name: Tenant white-label identity and input safety tests
        run: node --experimental-strip-types --test tests/tenant-white-label.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium
      - name: Official logo browser rendering and loading test
        run: node tests/look-brand-browser.test.mjs
      - name: Tenant white-label mobile branding and cross-company switching
        run: node tests/tenant-white-label-browser.test.mjs
      - name: Digital employee mobile onboarding and safe provider fallback
        run: node tests/digital-employee-browser.test.mjs
      - name: Look Digital Staff sales demonstration mobile 390px
        run: node tests/digital-staff-commercial-demo-browser.test.mjs
      - name: Tenant switching browser regression tests
        run: npm run test:browser:tenant
      - name: Password recovery browser regression tests
        run: node tests/auth-browser.test.mjs
      - name: Owner initial password browser regression tests
        run: node tests/owner-first-access-browser.test.mjs
      - name: Owner bootstrap live endpoint denial test
        run: node tests/owner-first-access-edge-live.test.mjs
      - name: Super Admin mobile browser regression tests
        run: node tests/platform-admin-browser.test.mjs
      - name: Private tenant files browser regression tests
        run: node tests/tenant-files-browser.test.mjs
      - name: Spanish team conversations and assignment browser tests
        run: node tests/omnichannel-assignment-browser.test.mjs
      - name: Company channel authorization browser regression tests
        run: node tests/company-channel-onboarding-browser.test.mjs
      - name: CRM integrations center mobile and tenant-scoped request browser test
        run: node tests/crm-integration-center-browser.test.mjs
