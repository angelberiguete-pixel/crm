name: Production HTTP Smoke

# Checks the deployed production site, not pull-request code.
# Pull requests are verified by CRM CI; do not report this smoke as PR E2E.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: read

jobs:
  public-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published HTTPS endpoints without credentials
        run: node tests/production-http-smoke.mjs
