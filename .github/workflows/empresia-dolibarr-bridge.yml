name: Empresia Dolibarr bridge
on:
  pull_request:
    paths:
      - 'supabase/functions/empresia-dolibarr/**'
      - 'supabase/functions/_shared/dolibarr-protocol.ts'
      - 'supabase/migrations/*empresia_dolibarr*'
      - 'components/empresia-erp-overview.tsx'
      - 'supabase/functions/empresia-dolibarr/protocol.test.ts'
      - 'tests/empresia-dolibarr-bridge-contract.test.mjs'
      - '.github/workflows/empresia-dolibarr-bridge.yml'
  push:
    branches:
      - 'feat/empresia-dolibarr-readonly-bridge-20261109'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/empresia-dolibarr/protocol.test.ts
      - run: deno check supabase/functions/empresia-dolibarr/index.ts
      - run: node --test tests/empresia-dolibarr-bridge-contract.test.mjs tests/empresia-erp-module.test.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
