name: CRM ARM Machine Learning QA
on:
  push:
    branches:
      - feat/platform-tenant-ml-intelligence-20261108
  pull_request:
    paths:
      - "lib/tenant-ml.ts"
      - "components/crm-ml-hub.tsx"
      - "components/crm-ml-hub.module.css"
      - "components/crm-workspace.tsx"
      - "components/family-power-menu.tsx"
      - "components/crm-sales-360.tsx"
      - "supabase/migrations/20261108200000_crm_tenant_machine_learning.sql"
      - "tests/tenant-ml.test.mjs"
      - ".github/workflows/crm-tenant-ml-qa.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Train on synthetic samples and assert tenant safety
        run: node --experimental-strip-types --test tests/tenant-ml.test.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
