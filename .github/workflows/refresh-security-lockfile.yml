name: Refresh security dependency lockfile
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/refresh-security-lockfile.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/shared-ai-capabilities-isolated-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          node --test tests/ai-capabilities-policy.test.mjs
          npm run typecheck
      - name: Commit lockfile to isolated branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(security): refresh patched dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
